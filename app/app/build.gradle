plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.adguardhome.android'
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }

    defaultConfig {
        // 主版本唯一变体。移除 lite 后直接用 standard 包名,保留旧升级路径。
        applicationId 'com.adguardhome.android.standard'
        // Miuix 0.9.3 依赖最低 Android 13,因此 minSdk 保留 33。
        minSdk 33
        targetSdk 35
        versionCode 47
        versionName '1.2.8-beta2'
        resValue 'string', 'app_name', 'AdGuard Home'
    }

    buildFeatures {
        compose true
        buildConfig true
        resValues true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/libsu-core-5.2.2.aar')
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha24'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.3'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}
